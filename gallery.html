<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>
    <style>
        body { font-family: sans-serif; background: #eee; text-align: center; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; }
        .card { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img { max-width: 200px; max-height: 200px; display: block; margin-bottom: 10px; }
        .card p { font-weight: bold; font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <h2>Daftar Foto di Folder Anda</h2>
    <p>Tolong sebutkan nama file (misal: f.jpeg) mana yang untuk Groom, Bride, dan Prewed</p>
    <div class="grid">
        <div class="card"><img src="./assets/images/a.jpeg"><p>a.jpeg</p></div>
        <div class="card"><img src="./assets/images/b.jpeg"><p>b.jpeg</p></div>
        <div class="card"><img src="./assets/images/c.jpeg"><p>c.jpeg</p></div>
        <div class="card"><img src="./assets/images/d.jpeg"><p>d.jpeg</p></div>
        <div class="card"><img src="./assets/images/e.jpeg"><p>e.jpeg</p></div>
        <div class="card"><img src="./assets/images/f.jpeg"><p>f.jpeg</p></div>
        <div class="card"><img src="./assets/images/g.jpeg"><p>g.jpeg</p></div>
        <div class="card"><img src="./assets/images/i.jpeg"><p>i.jpeg</p></div>
        <div class="card"><img src="./assets/images/j.jpeg"><p>j.jpeg</p></div>
        <div class="card"><img src="./assets/images/banner.webp"><p>banner.webp</p></div>
        <div class="card"><img src="./assets/images/bg.webp"><p>bg.webp</p></div>
        <div class="card"><img src="./assets/images/cewe.webp"><p>cewe.webp</p></div>
        <div class="card"><img src="./assets/images/cowo.webp"><p>cowo.webp</p></div>
        <div class="card"><img src="./assets/images/placeholder.webp"><p>placeholder.webp</p></div>
    </div>
</body>
</html>
